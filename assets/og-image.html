<!doctype html>
<!-- Template of the link preview images (public/static/og/<theme>.jpg), rendered per background by: npm run og
     It uses the site's own stylesheets, so the card, its color and the photo match the pages. -->
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/static/style.css">
<link rel="stylesheet" href="/static/themes.css">
<style>
	html, body { width: 1200px; height: 630px; overflow: hidden; }
	body {
		padding: 0;
		display: flex;
		align-items: center;
	}
	main {
		max-width: none;
		width: 600px;
		box-sizing: border-box;
		/* like the pages: at the left so the photo's motif stays visible, or centered (--card-start: auto) */
		margin: 0 auto 0 var(--card-start, 80px);
		padding: 32px 48px 36px;
	}
	h1 { font-size: 74px; margin: 0 0 8px; white-space: nowrap; }
	p { margin: 0; font-size: 28px; line-height: 1.3; color: var(--ink-soft); }
	.tag { margin: 32px 0 24px 40px; transform: rotate(-4deg) scale(1.3); }
	.url { font-size: 26px; }
</style>
</head>
<body data-theme="{{theme}}">
	<main>
		<h1>Wichteltopf</h1>
		<p>Namen eintragen, geheim auslosen, gegenseitig beschenken.</p>
		<div class="tag tag-big"><div class="tag-paper">
			<span class="tag-line"><span class="tag-label">Von:</span> <span class="tag-value">???</span></span>
			<span class="tag-line"><span class="tag-label">Für:</span> <span class="tag-value">dich</span></span>
		</div></div>
		<p class="url">wichteltopf.de</p>
	</main>
</body>
</html>
